name: Build & Release com.slopware.androidllm APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: false
      prerelease:
        description: "Mark GitHub Release as pre-release"
        type: boolean
        default: true
      tag_name:
        description: "Release tag name (optional for workflow_dispatch, e.g. v0.1.0-dev.1)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolve build metadata
        id: meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG_NAME#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG_NAME}" ]; then
            TAG_NAME="${INPUT_TAG_NAME}"
            VERSION_NAME="${TAG_NAME#v}"
          else
            VERSION_NAME="0.1.0-dev.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
            TAG_NAME="v0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          if [ "${INPUT_PRERELEASE}" = "true" ] || [[ "${VERSION_NAME}" == *-dev* || "${VERSION_NAME}" == *-alpha* || "${VERSION_NAME}" == *-beta* || "${VERSION_NAME}" == *-rc* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          {
            echo "version_code=${GITHUB_RUN_NUMBER}"
            echo "version_name=${VERSION_NAME}"
            echo "tag_name=${TAG_NAME}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure optional release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Configured release keystore from secrets."
          else
            echo "SIGNING_KEYSTORE_BASE64 not set; falling back to debug keystore for in-development release APK."
          fi

      - name: Run unit tests and build arm64-v8a APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease assembleDebug \
            --no-daemon --console=plain \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}"

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: com.slopware.androidllm-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Stage APKs and checksums
        run: |
          mkdir -p dist
          V="${{ steps.meta.outputs.version_name }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/com.slopware.androidllm-v${V}-arm64-v8a-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/com.slopware.androidllm-v${V}-arm64-v8a-debug.apk"
          (cd dist && sha256sum \
            "com.slopware.androidllm-v${V}-arm64-v8a-release.apk" \
            "com.slopware.androidllm-v${V}-arm64-v8a-debug.apk" \
            > "com.slopware.androidllm-v${V}-SHA256SUMS.txt")

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: com.slopware.androidllm-arm64-v8a-release
          path: |
            dist/com.slopware.androidllm-v*-arm64-v8a-release.apk
            dist/com.slopware.androidllm-v*-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: com.slopware.androidllm-arm64-v8a-debug
          path: dist/com.slopware.androidllm-v*-arm64-v8a-debug.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: com.slopware.androidllm-arm64-v8a-release
          path: release-apks

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: com.slopware.androidllm-arm64-v8a-debug
          path: release-apks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "com.slopware.androidllm ${{ needs.build.outputs.tag_name }} (arm64-v8a)"
          tag_name: ${{ needs.build.outputs.tag_name }}
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-apks/com.slopware.androidllm-*-arm64-v8a-release.apk
            release-apks/com.slopware.androidllm-*-arm64-v8a-debug.apk
            release-apks/com.slopware.androidllm-*-SHA256SUMS.txt
